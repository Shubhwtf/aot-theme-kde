# ============================================
# ◆ ATTACK ON TITAN KITTY CONFIG — Shinzou wo Sasageyo
# ============================================

# ===== FONT CONFIGURATION =====
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 12.0

# Font features for ligatures
font_features JetBrainsMonoNerdFont-Regular +liga +calt +dlig

# Adjust line height for breathing room
adjust_line_height  120%
adjust_column_width 0

# ===== CURSOR CONFIGURATION =====
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ODM-gear style trail when the cursor jumps
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ===== SCROLLBACK =====
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ===== MOUSE =====
mouse_hide_wait 3.0
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
copy_on_select yes

# ===== TERMINAL BELL =====
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "◆ "

# ===== WINDOW LAYOUT =====
remember_window_size  yes
initial_window_width  1400
initial_window_height 900

window_padding_width 10
window_margin_width 0
single_window_margin_width -1

# Window border (colors come from the theme)
window_border_width 1pt
draw_minimal_borders yes

# Hide window decorations (title bar)
hide_window_decorations no
placement_strategy center

# ===== TAB BAR =====
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 4.0 2.0
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 2

tab_powerline_style slanted

tab_title_template " {index}: {title[title.rfind('/')+1:]} "
active_tab_title_template " ◆ {index}: {title[title.rfind('/')+1:]} "

# ===== COLOR SCHEME - Attack on Titan =====
# palette: leather #12100e, parchment #e8dcc4, crimson #b8302a, brass #c9a14a, corps green #5c8f6c
include themes/attack-on-titan.conf

# ===== BACKGROUND OPACITY & BLUR =====
background_opacity 0.94
background_blur 64

# Dynamic background opacity
dynamic_background_opacity yes

# ===== ADVANCED =====
shell .
editor .
close_on_child_death no
allow_remote_control yes
listen_on unix:/tmp/kitty

update_check_interval 0
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

term xterm-256color

# ===== PERFORMANCE =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== KEYBOARD SHORTCUTS =====

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# Window management
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+alt+t set_tab_title

# Layout management
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack

# Font sizes
map ctrl+shift+equal     change_font_size all +2.0
map ctrl+shift+minus     change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Opacity control
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end

# Miscellaneous
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f2 edit_config_file
map ctrl+shift+escape kitty_shell window

# Search
map ctrl+shift+/ launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R

# ===== UNICODE & SYMBOLS =====
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# ===== BELLS AND WHISTLES =====
confirm_os_window_close 1

# Startup session
startup_session none

# Allow programs to use clipboard
clipboard_max_size 512

# ===== MACOS SPECIFIC (if on mac, otherwise ignored) =====
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in all
macos_thicken_font 0.15

# ===== ADVANCED FEATURES =====
allow_hyperlinks yes
shell_integration enabled

# Kitty kitten themes (uncomment to use)
# include ./theme.conf

